spring.application.name=sboot-acl-pedidos
server.port=8081

# Endereço do broker Kafka (Docker local)
spring.kafka.bootstrap-servers=localhost:9092

# Serializadores (Chave como String, Payload como JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Nome do tópico Kafka para onde os pedidos serão enviados
app.kafka.topic.pedido-recebido=pedidos-recebidos-v1